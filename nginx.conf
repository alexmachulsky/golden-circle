server {
    listen 80;
    server_name _;
    server_tokens off;

    # Strip any client-supplied IP headers, then set the real values.
    # This prevents IP spoofing for rate-limit bucketing.
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host            $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version               1.1;

    # Required for server-sent events / streaming responses
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Health endpoint — restrict to internal/loopback only
    location = /api/health {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://app:7001;
    }

    location / {
        proxy_pass http://app:7001;
    }
}

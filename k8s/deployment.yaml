apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-circle
  namespace: golden-circle
  labels:
    app.kubernetes.io/name: golden-circle
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: golden-circle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golden-circle
        app.kubernetes.io/component: web
    spec:
      # Use the dedicated SA with no Kubernetes API permissions; token is not
      # mounted so a compromised pod cannot authenticate to the API server.
      serviceAccountName: golden-circle
      automountServiceAccountToken: false

      # Mirror the Dockerfile's non-root user
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      containers:
        - name: golden-circle
          # Minikube POC only — image is loaded directly into Minikube's Docker
          # daemon via `minikube image load golden-circle:latest`.
          # For EKS, replace with the pinned GHCR digest published by CI:
          #   image: ghcr.io/alexmachulsky/golden-circle@sha256:<digest>
          image: golden-circle:latest
          # Never pull — image is loaded directly into Minikube's Docker daemon.
          # For EKS: change to IfNotPresent and set image to your GHCR path.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 7001
              protocol: TCP

          envFrom:
            - configMapRef:
                name: golden-circle-config

          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: golden-circle-secrets
                  key: openrouter-api-key
            - name: UPSTASH_REDIS_REST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: golden-circle-secrets
                  key: upstash-redis-rest-token
            - name: TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: golden-circle-secrets
                  key: turnstile-secret-key

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Next.js standalone writes tmp files
            capabilities:
              drop:
                - ALL

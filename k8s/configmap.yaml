apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-circle-config
  namespace: golden-circle
  labels:
    app.kubernetes.io/name: golden-circle
data:
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "7001"
  HOSTNAME: "0.0.0.0"
  # Local Minikube POC: port-forward maps to localhost:7001/:7002.
  # EKS: replace with your ALB/ingress URL, e.g. https://golden-circle.example.com.
  # Do NOT commit per-operator LAN addresses here — keep environment-specific
  # origins in a kustomize overlay or a separate *-prod.yaml manifest.
  ALLOWED_ORIGINS: "http://localhost:7001,http://localhost:7002"
  # Use x-real-ip — ingress-nginx sets this to the single client IP it
  # observed. x-forwarded-for is a comma-separated chain whose rightmost
  # entry is the ingress controller's hop, which would key all traffic on
  # one bucket. The ingress MUST strip any inbound x-real-ip from clients
  # before setting its own (default in ingress-nginx).
  TRUSTED_IP_HEADER: "x-real-ip"
  # Turnstile and Upstash are required for public production. Leave commented
  # out for local/dev clusters: lib/turnstile rejects mismatched site/secret
  # pairs, and a placeholder URL for Upstash would 503 every analyze. Set to
  # real values before applying these manifests to a public cluster.
  # TURNSTILE_SITE_KEY: "<your-cloudflare-turnstile-site-key>"
  # UPSTASH_REDIS_REST_URL: "https://<your-upstash-host>"
  RATE_LIMIT_PER_MIN: "20"

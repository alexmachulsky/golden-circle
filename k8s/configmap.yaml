apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-circle-config
  namespace: golden-circle
  labels:
    app.kubernetes.io/name: golden-circle
data:
  NODE_ENV: "production"
  DEPLOYMENT_MODE: "public"
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "7001"
  HOSTNAME: "0.0.0.0"
  # Replace with your public origin once the ALB + ingress/nginx layer is in place.
  ALLOWED_ORIGINS: "https://golden-circle.example.com"
  # The ingress layer must strip inbound copies and rewrite a single x-client-ip value.
  TRUSTED_IP_HEADER: "x-client-ip"
  TURNSTILE_SITE_KEY: "replace-with-your-public-site-key"
  UPSTASH_REDIS_REST_URL: "https://replace-with-your-upstash-url"
  RATE_LIMIT_PER_MIN: "20"

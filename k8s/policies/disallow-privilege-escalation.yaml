apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Privilege escalation lets a process gain more privileges than its parent.
      Every container must set securityContext.allowPrivilegeEscalation to false.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: deny-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Privilege escalation is disallowed. Set allowPrivilegeEscalation to false on every container."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false

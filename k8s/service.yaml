apiVersion: v1
kind: Service
metadata:
  name: golden-circle
  namespace: golden-circle
  labels:
    app.kubernetes.io/name: golden-circle
spec:
  # ClusterIP for the Minikube POC — access via kubectl port-forward.
  # For EKS: change to LoadBalancer (or use an Ingress + ALB controller).
  type: ClusterIP
  selector:
    app.kubernetes.io/name: golden-circle
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

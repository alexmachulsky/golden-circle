services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner        # build only up to the final stage
    image: golden-circle:latest
    container_name: golden-circle
    restart: unless-stopped
    ports:
      - "0.0.0.0:7001:7001"
    environment:
      NODE_ENV: production
      ALLOWED_ORIGINS: "http://localhost:7001,http://192.168.18.241:7001"
      # Secrets are injected via Docker secrets (_FILE vars below).
      # Do NOT set GROQ_API_KEY, UPSTASH_REDIS_REST_TOKEN, or TURNSTILE_SECRET_KEY
      # here because explicit "environment" entries override env_file values,
      # which would silently blank them out.
      GROQ_API_KEY_FILE: /run/secrets/groq_api_key
      UPSTASH_REDIS_REST_TOKEN_FILE: /run/secrets/upstash_redis_rest_token
      TURNSTILE_SECRET_KEY_FILE: /run/secrets/turnstile_secret_key
    env_file:
      # Non-secret runtime config comes from .env.local.
      # Keep GROQ_API_KEY, UPSTASH_REDIS_REST_TOKEN, and TURNSTILE_SECRET_KEY
      # out of this file; mount them through Docker secrets instead.
      - .env.local
    secrets:
      - groq_api_key
      - upstash_redis_rest_token
      - turnstile_secret_key
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7001/api/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

secrets:
  groq_api_key:
    file: ./secrets/groq_api_key.txt
  upstash_redis_rest_token:
    file: ./secrets/upstash_redis_rest_token.txt
  turnstile_secret_key:
    file: ./secrets/turnstile_secret_key.txt

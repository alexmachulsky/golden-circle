services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner        # build only up to the final stage
    image: golden-circle:latest
    container_name: golden-circle
    restart: unless-stopped
    ports:
      - "7001:7001"
    environment:
      NODE_ENV: production
    env_file:
      # Runtime secrets come from the host .env.local file.
      # Do not mirror them through ${...} here: compose interpolation happens
      # before env_file is loaded and can override the real value with empty text.
      # Public production deployments should run behind a trusted reverse proxy
      # and include UPSTASH_REDIS_REST_* plus TRUSTED_IP_HEADER in .env.local.
      - .env.local
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7001/', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

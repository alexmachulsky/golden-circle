services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: golden-circle:latest
    container_name: golden-circle
    restart: unless-stopped
    ports:
      # Loopback-only local-dev default: `docker compose up -d --build` just works
      # using the Groq key in .env.local, the in-memory rate limiter, and no
      # reverse proxy. Bound to 127.0.0.1 so a naive `up` is never network-exposed.
      # For the hardened, nginx-fronted public deployment use docker-compose.prod.yml
      # (Docker secrets + Upstash + Turnstile) or the k8s manifests.
      - "127.0.0.1:7001:7001"
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid
    environment:
      NODE_ENV: production
      DEPLOYMENT_MODE: local
      ALLOWED_ORIGINS: "http://localhost:7001,http://127.0.0.1:7001"
    env_file:
      - .env.local
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7001/api/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

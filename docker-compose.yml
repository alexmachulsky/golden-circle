services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner        # build only up to the final stage
    image: golden-circle:latest
    container_name: golden-circle
    restart: unless-stopped
    ports:
      - "127.0.0.1:7001:7001"
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    environment:
      NODE_ENV: production
      DEPLOYMENT_MODE: local
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:7001}"
      RATE_LIMIT_PER_MIN: "${RATE_LIMIT_PER_MIN:-20}"
      GROQ_API_KEY_FILE: /run/secrets/groq_api_key
    secrets:
      - groq_api_key
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7001/api/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

secrets:
  groq_api_key:
    file: ./secrets/groq_api_key.txt

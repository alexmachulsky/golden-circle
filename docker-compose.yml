services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner        # build only up to the final stage
    image: golden-circle:latest
    container_name: golden-circle
    restart: unless-stopped
    ports:
      - "7001:7001"
    environment:
      - NODE_ENV=production
      # GROQ_API_KEY is read from the .env.local file on the host;
      # it is never baked into the image.
      - GROQ_API_KEY=${GROQ_API_KEY}
    env_file:
      - .env.local           # sourced automatically if it exists on the host
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

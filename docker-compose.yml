services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: golden-circle:latest
    container_name: golden-circle
    restart: unless-stopped
    ports:
      # LAN-exposed: bound to 0.0.0.0 so other machines on the local network can
      # reach the app (e.g. browsing to http://192.168.18.241:7001). Note: this
      # removes the loopback-only safeguard — there is no reverse proxy, TLS, or
      # per-IP rate limiting in front of it. For a hardened public deployment use
      # docker-compose.prod.yml (Docker secrets + Upstash + Turnstile) or k8s.
      - "0.0.0.0:7001:7001"
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid
    environment:
      NODE_ENV: production
      DEPLOYMENT_MODE: local
      ALLOWED_ORIGINS: "http://localhost:7001,http://127.0.0.1:7001,http://192.168.18.241:7001"
    env_file:
      - .env.local
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7001/api/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

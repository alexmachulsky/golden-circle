services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner        # build only up to the final stage
    image: golden-circle:latest
    container_name: golden-circle
    restart: unless-stopped
    ports:
      - "7001:7001"
    environment:
      NODE_ENV: production
    env_file:
      # Runtime secrets come from the host .env.local file.
      # Do not mirror them through ${...} here: compose interpolation happens
      # before env_file is loaded and can override the real value with empty text.
      - .env.local
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: golden-circle:latest
    container_name: golden-circle-local
    restart: unless-stopped
    ports:
      # 0.0.0.0 binding for LAN testing (e.g. http://192.168.18.241:7001).
      # This compose file is plaintext-HTTP and uses the in-memory rate
      # limiter — do not expose it to untrusted networks. For production
      # use the main docker-compose.yml (nginx-fronted) or the k8s manifests.
      - "0.0.0.0:7001:7001"
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid
    environment:
      NODE_ENV: production
      DEPLOYMENT_MODE: local
      ALLOWED_ORIGINS: "http://localhost:7001,http://127.0.0.1:7001,http://192.168.18.241:7001"
    env_file:
      - .env.local
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7001/api/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

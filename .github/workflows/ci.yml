name: CI/CD Pipeline

# ─────────────────────────────────────────────
# Pipeline stages (sequential)
#   1. build   — compile source, produce Next.js artifacts
#   2. verify  — unit tests, lint, type-check, dependency audit
#   3. package — Docker image build + Trivy vulnerability scan → SARIF
#   4. publish — push image to GHCR (main branch, production environment)
# ─────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR to save quota
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default — jobs grant only what they need
permissions:
  contents: read

# Image name shared across jobs
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ── 1. BUILD ──────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # GROQ_API_KEY is runtime-only — not consumed by next build

  # ── 2. VERIFY ─────────────────────────────────────────────────────────────
  verify:
    name: Test & Code Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Dependency audit
        # Audit only production dependencies; dev deps don't reach the container
        run: npm audit --audit-level=high --omit=dev

  # ── 3. PACKAGE ────────────────────────────────────────────────────────────
  package:
    name: Package & Scan
    runs-on: ubuntu-latest
    needs: verify

    permissions:
      contents: read
      security-events: write  # required to upload SARIF to GitHub Security

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Build Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          target: runner
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy SARIF)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          # SARIF output includes all severities by default, so keep report
          # generation separate from the CRITICAL/HIGH enforcement gate below.
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          trivyignores: .trivyignore

      - name: Upload Trivy results to GitHub Security tab
        if: hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Enforce Trivy gate (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          skip-setup-trivy: true

  # ── 4. PUBLISH ────────────────────────────────────────────────────────────
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: package
    # Push only on merges to main — never from PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    permissions:
      contents: read
      packages: write
      # Required for SLSA provenance attestation
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          # Reuse cached layers from the package job — no full rebuild
          cache-from: type=gha
          # Emit an SBOM and SLSA provenance attestation; stored in the GHCR OCI registry.
          sbom: true
          provenance: mode=max

name: CI/CD Pipeline

# ─────────────────────────────────────────────
# Pipeline stages
#   1.  build       — compile source, produce Next.js artifacts
#   2.  verify      — unit tests, lint, type-check, dependency audit
#   2b. secret-scan — gitleaks full-history scan
#   2c. iac-lint    — hadolint, actionlint, kubeconform, kube-score, checkov
#   2d. policy      — Kyverno policy unit tests + report vs. live manifests
#   3.  package     — Docker image build + Trivy vulnerability scan → SARIF
#   4.  publish     — push image to GHCR (main branch, production environment)
#
# All third-party tools run from Docker images pinned by sha256 digest, matching
# the base-image pinning in the Dockerfile.
# ─────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR to save quota
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default — jobs grant only what they need
permissions:
  contents: read

# Image name shared across jobs
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ── 1. BUILD ──────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # OPENROUTER_API_KEY is runtime-only — not consumed by next build

  # ── 2. VERIFY ─────────────────────────────────────────────────────────────
  verify:
    name: Test & Code Analysis
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Dependency audit
        # Audit only production dependencies; dev deps don't reach the container
        run: npm audit --audit-level=high --omit=dev

  # ── 2b. SECRET SCAN ────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read # read-only: clone full history and report

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0 # full history so historical leaks are caught

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Required since gitleaks-action v2 to scan pull_request events.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2c. IAC & CONFIG LINT ──────────────────────────────────────────────────
  # Lints the artifacts that produce the running system — the Dockerfile, the
  # workflows themselves, and the Kubernetes manifests — none of which Trivy or
  # CodeQL cover. Deterministic linters (hadolint, actionlint, kubeconform,
  # kube-score) gate the build; Checkov uploads an informational SARIF report.
  iac-lint:
    name: IaC & Config Lint
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    permissions:
      contents: read
      security-events: write  # upload Checkov SARIF to the Security tab

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Lint Dockerfile (hadolint)
        # Mount the repo so hadolint discovers .hadolint.yaml from the work dir.
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            hadolint/hadolint:2.12.0-alpine@sha256:3c206a451cec6d486367e758645269fd7d696c5ccb6ff59d8b03b0e45268a199 \
            hadolint Dockerfile

      - name: Lint GitHub Actions workflows (actionlint)
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color

      - name: Validate Kubernetes schemas (kubeconform)
        # Only the workload manifests; the Kyverno CRDs in k8s/policies/ are
        # validated by the policy job. -strict rejects unknown fields.
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            ghcr.io/yannh/kubeconform:v0.6.7-alpine@sha256:824e0c248809e4b2da2a768b16b107cf17ada88a89ec6aa6050e566ba93ebbc6 \
            -strict -summary -ignore-missing-schemas \
            k8s/namespace.yaml k8s/configmap.yaml k8s/deployment.yaml \
            k8s/service.yaml k8s/ingress.yaml k8s/networkpolicy.yaml k8s/rbac.yaml

      - name: Score Kubernetes manifests (kube-score)
        # The deployment is scored together with its NetworkPolicy so the
        # pod-networkpolicy test resolves. Ignored tests are deliberate
        # Minikube-POC choices (see k8s/deployment.yaml):
        #   container-image-tag / -pull-policy — image is side-loaded, not pulled
        #   container-security-context-user-group-id — uid/gid 1001 is baked into
        #     the Dockerfile's non-root user; overriding to >10000 would mismatch
        #     the image's filesystem ownership
        #   pod-probes-identical — the app exposes a single /api/health endpoint;
        #     readiness and liveness use it with different timing, by design
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            zegl/kube-score:v1.20.0@sha256:ac4c43ad560af905d66f6bf57b0937c591332e6dbf2167c31193a13b4695ab97 \
            score \
            --ignore-test container-image-tag,container-image-pull-policy,container-security-context-user-group-id,pod-probes-identical \
            k8s/deployment.yaml k8s/service.yaml k8s/networkpolicy.yaml

      - name: Checkov (IaC misconfig → SARIF)
        # soft-fail (.checkov.yaml): report, don't block. SARIF → Security tab.
        run: |
          docker run --rm -v "$PWD":/repo -w /repo --entrypoint checkov \
            ghcr.io/bridgecrewio/checkov:3.2.334@sha256:888060aaaa6f4499fd3b00a1a03185ed760937b049d438fa6e00b3203a5d613e \
            --config-file .checkov.yaml -o sarif > checkov.sarif

      - name: Upload Checkov SARIF to GitHub Security tab
        if: ${{ always() && hashFiles('checkov.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4
        with:
          sarif_file: checkov.sarif
          category: checkov

  # ── 2d. POLICY-AS-CODE (Kyverno) ───────────────────────────────────────────
  # `kyverno test` proves the ClusterPolicies pass compliant pods and fail
  # violations (gating). `kyverno apply` then reports the live manifests against
  # the same policies in Audit mode (non-gating — see k8s/policies/README.md).
  policy:
    name: Policy (Kyverno)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Kyverno policy unit tests
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            ghcr.io/kyverno/kyverno-cli:v1.13.4@sha256:cbff7f69822804b4331539372941b1a458bb79da4dce899ea3149095435feccc \
            test k8s/policies/tests/

      - name: Kyverno policies vs. live manifests (report)
        # Audit mode + --audit-warn: reports violations without failing the job.
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            ghcr.io/kyverno/kyverno-cli:v1.13.4@sha256:cbff7f69822804b4331539372941b1a458bb79da4dce899ea3149095435feccc \
            apply \
            k8s/policies/require-run-as-nonroot.yaml \
            k8s/policies/disallow-privilege-escalation.yaml \
            k8s/policies/require-drop-all-capabilities.yaml \
            k8s/policies/require-resource-limits.yaml \
            k8s/policies/disallow-latest-tag.yaml \
            --resource k8s/deployment.yaml --audit-warn
        # NOTE: verify-image-signatures.yaml is intentionally excluded here. Its
        # verifyImages rule needs live registry + Rekor access, which neither
        # `kyverno test` nor offline `kyverno apply` has — it is enforced at real
        # cluster admission and verified in CI by the cosign signing step instead.

  # ── 3. PACKAGE ────────────────────────────────────────────────────────────
  package:
    name: Package & Scan
    runs-on: ubuntu-latest
    needs: [verify, secret-scan, iac-lint, policy]
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write  # required to upload SARIF to GitHub Security

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Build Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          target: runner
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy SARIF)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          # SARIF output includes all severities by default, so keep report
          # generation separate from the CRITICAL/HIGH enforcement gate below.
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          trivyignores: .trivyignore

      - name: Upload Trivy results to GitHub Security tab
        if: hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Enforce Trivy gate (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          skip-setup-trivy: true

  # ── 4. PUBLISH ────────────────────────────────────────────────────────────
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: package
    timeout-minutes: 20
    # Push only on merges to main — never from PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    permissions:
      contents: read
      packages: write
      # Required for SLSA provenance attestation
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          # Reuse cached layers from the package job — no full rebuild
          cache-from: type=gha
          # Emit an SBOM and SLSA provenance attestation; stored in the GHCR OCI registry.
          sbom: true
          provenance: mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image (keyless / Sigstore OIDC)
        # Keyless signature bound to this workflow's OIDC identity (no long-lived
        # keys). Signs by immutable digest, not tag, so the exact pushed manifest
        # is attested. The signature is stored alongside the image in GHCR and the
        # transparency record is logged to Rekor. Verify with:
        #   cosign verify ghcr.io/alexmachulsky/golden-circle@<digest> \
        #     --certificate-identity-regexp '^https://github.com/alexmachulsky/golden-circle/.github/workflows/ci.yml@.*' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

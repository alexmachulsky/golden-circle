services:
  nginx:
    image: nginx:1.27-alpine
    container_name: golden-circle-nginx
    depends_on:
      - app
    ports:
      - "127.0.0.1:7001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: golden-circle:latest
    container_name: golden-circle
    restart: unless-stopped
    expose:
      - "7001"
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    environment:
      NODE_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:7001}
      TRUSTED_IP_HEADER: x-real-ip
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      GROQ_API_KEY_FILE: /run/secrets/groq_api_key
      UPSTASH_REDIS_REST_TOKEN_FILE: /run/secrets/upstash_redis_rest_token
      TURNSTILE_SECRET_KEY_FILE: /run/secrets/turnstile_secret_key
    secrets:
      - groq_api_key
      - upstash_redis_rest_token
      - turnstile_secret_key
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7001/api/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

secrets:
  groq_api_key:
    file: ./secrets/groq_api_key.txt
  upstash_redis_rest_token:
    file: ./secrets/upstash_redis_rest_token.txt
  turnstile_secret_key:
    file: ./secrets/turnstile_secret_key.txt
